name: Build & Deploy to GH Pages
on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            pages: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.13.1
            - uses: actions/setup-node@v6
              with:
                  cache: pnpm
                  node-version: 24
            - run: pnpm install
            - run: pnpm build
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist
            - uses: actions/deploy-pages@v4
              id: deployment
